<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디베이트 무대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: setup card on top, a 16:9 broadcast stage (world layers + WebGL cast + HUD), compact controls under it */
:root{
  --bg:#F2F4F1; --surface:#ffffff; --ink:#18212C; --muted:#5F6875; --line:#DCE1DA;
  --blue:#1F3E8F; --blue-2:#2e5bd8; --blue-soft:#e4ebfb; --wood:#e9d8be; --wood-2:#dcc6a6; --wall:#eef1f5; --cue:#FFE47A; --green:#2BA36B;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171E;--surface:#1A212B;--ink:#E7ECF2;--muted:#9AA4B1;--line:#2A3340;--blue:#8FB0FF;--blue-soft:#1E3350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171E;--surface:#1A212B;--ink:#E7ECF2;--muted:#9AA4B1;--line:#2A3340;--blue:#8FB0FF;--blue-soft:#1E3350;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:transparent;color:var(--ink);font-family:var(--sans)}
.wrap{display:flex;flex-direction:column;gap:10px;padding:2px 0 12px}
.setup{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
/* 옵션 상자 배경: 캐릭터들을 아주 옅게 */
.opt{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:6px}
.opt.top{grid-template-columns:1fr;gap:5px}
.opt .lab{font-size:11px;color:var(--muted);padding-top:1px}
.opt.top .lab{padding-top:0}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.pick{font:600 12px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer;min-height:26px}
.pick[aria-pressed="true"]{border-color:var(--ink);color:var(--surface);background:var(--ink)}
select,.setup input[type=text]{font:500 12px var(--sans);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 6px;min-height:26px;max-width:100%}
.opt select{justify-self:start}
/* 캐릭터 카드: 누르면 이름·발음 바꾸기 */
.castrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:420px}

.cc{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 5px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.cc[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cc.me{border-color:#E0A800;box-shadow:0 0 0 1px #E0A800}
.cc .face{position:relative;width:100%;aspect-ratio:5/4;border-radius:6px;overflow:hidden;background:#e4ebfb;margin-bottom:3px}
.cc .face img{position:absolute;max-width:none}
.cc .en{font-size:12px;font-weight:700;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .ko{font-size:10px;color:var(--muted);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .nick{font:500 8.5px var(--mono);color:#2e5bd8;line-height:1.3;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cc .rl{margin-top:2px;font-size:9px;line-height:1.3;color:var(--ink);background:var(--bg);border-radius:4px;padding:0 4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cc .badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:800;background:#E0A800;color:#fff;border-radius:5px;padding:0 4px;line-height:1.5}
.editor{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 10px;display:grid;gap:6px}
.ed-head{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.x{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 6px}
.ed-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.ed-row input,.ed-row select{width:100%}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.keep{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);cursor:pointer}
.keep input{width:16px;height:16px;accent-color:var(--blue);margin:0}
.go{width:58px;height:58px;flex:none;border-radius:50%;padding:0;font:800 17px var(--sans);letter-spacing:.01em;background:var(--blue);color:#fff;border:0;cursor:pointer;box-shadow:0 4px 12px #1F3E8F40;transition:transform .12s}
.go:active{transform:scale(.94)}
@media (prefers-color-scheme:dark){.go{color:#0E1420}}
:is(.pick,.go,.btn,.cc,.x,select,input):focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.note{font-size:11px;line-height:1.45;color:var(--muted);margin:0}

/* ---------- stage (1600×900 world, scaled) ---------- */
.stage{--u:1cqw;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:var(--wall);border:1px solid var(--line);container-type:inline-size;user-select:none}
.world{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;color:#1b1d22}
#gl{position:absolute;inset:0;width:100%;height:100%}
.bg-wall{position:absolute;inset:0 0 140px 0;background:linear-gradient(180deg,#f6f8fb 0%,#e9eef6 100%)}
.bg-wall::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 158px,#d6dde930 158px 160px)}
.led{position:absolute;left:0;right:0;top:372px;height:6px;background:linear-gradient(90deg,transparent,#2e5bd8 15%,#2e5bd8 85%,transparent);opacity:.55}
.screen{position:absolute;left:430px;top:70px;width:740px;height:250px;background:#fff;border-radius:14px;border:2px solid #cfd8ea;box-shadow:0 14px 30px #1b1d2214;padding:24px 40px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.screen .lab{font-family:var(--mono);font-size:17px;letter-spacing:.14em;color:#2e5bd8}
.screen .txt{font-size:33px;color:#1F3E8F;font-weight:700;line-height:1.3;text-wrap:balance}
.screen .ko{font-size:21px;color:#60656d}
.floor{position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(var(--wood),var(--wood-2))}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 118px,#00000010 118px 120px)}
.shadow{position:absolute;width:150px;height:26px;margin-left:-75px;margin-top:-13px;border-radius:50%;background:radial-gradient(closest-side,#1b1d2233,#1b1d2200)}
.desk{position:absolute;top:690px;height:180px;border-radius:14px 14px 4px 4px;background:#fff;border:2px solid #d5dae3;box-shadow:0 10px 0 #c9d0dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.desk::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:var(--team)}
.desk .side{font-family:var(--mono);font-size:19px;letter-spacing:.16em;color:var(--team);margin-top:12px}
.desk .team{font-size:32px;font-weight:700}
.desk.chair{top:720px;height:150px}
.desk.chair .team{font-size:24px}
.lectern{position:absolute;left:720px;top:668px;width:160px;height:210px;background:linear-gradient(#f2e4cd,#d9c19c);clip-path:polygon(4% 0,96% 0,84% 100%,16% 100%);display:flex;justify-content:center;padding-top:44px}
.lectern::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:#2e5bd8}
.lectern span{width:54px;height:54px;border-radius:50%;background:#2e5bd8;color:#fff;font-family:var(--mono);font-size:20px;display:grid;place-items:center}
.mic{position:absolute;left:760px;top:636px;width:6px;height:36px;background:#3a3f48;transform:rotate(-14deg);transform-origin:bottom}
.mic::before{content:"";position:absolute;top:-16px;left:-8px;width:22px;height:26px;border-radius:40%;background:#2b2f36}

.hud{position:absolute;inset:0;pointer-events:none;z-index:5;color:#1b1d22}
.clock{position:absolute;right:calc(2.4*var(--u));top:calc(2.2*var(--u));font-family:var(--mono);font-size:calc(1.7*var(--u));background:#18212C;color:#fff;border-radius:calc(.7*var(--u));padding:calc(.4*var(--u)) calc(1*var(--u));font-variant-numeric:tabular-nums}
.clock[hidden]{display:none}
.lower{position:absolute;left:calc(2.4*var(--u));top:calc(2.2*var(--u));display:flex;flex-direction:column;align-items:flex-start;transform:translateX(-30%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1),opacity .3s}
.lower.on{transform:none;opacity:1}
.lower .a{background:var(--team,#2e5bd8);color:#fff;font-weight:700;font-size:calc(2.3*var(--u));padding:calc(.5*var(--u)) calc(1.6*var(--u)) calc(.55*var(--u)) calc(1.3*var(--u));border-radius:calc(.5*var(--u)) calc(.5*var(--u)) calc(.5*var(--u)) 0}
.lower .b{background:#fff;font-family:var(--mono);font-size:calc(1.3*var(--u));letter-spacing:.05em;padding:calc(.4*var(--u)) calc(1.3*var(--u));border-radius:0 0 calc(.5*var(--u)) calc(.5*var(--u));box-shadow:0 calc(.4*var(--u)) calc(1*var(--u)) #1b1d221a}
.sub{position:absolute;left:0;right:0;bottom:0;text-align:center;opacity:0;transition:opacity .2s;background:#ffffffee;border-radius:0;border-top:1px solid #dfe5ee;padding:calc(.9*var(--u)) calc(2.4*var(--u)) calc(1.1*var(--u))}
.sub.on{opacity:1}
.sub{pointer-events:auto;cursor:pointer}
.sub.dark{background:#0b0f15e6;color:#fff;border-top-color:#000}
.sub.dark .en b{color:#9DC1FF}
.sub.dark .ko{color:#c3ccd8}
.sub.dark.me{background:#2a2300ee;border-top-color:#F2C14E}
.sub.dark .badge{color:#F2C14E}
.sub.me{background:#FFF6CC;border-top:calc(.3*var(--u)) solid #F2C14E}
.sub .badge{display:block;font:700 calc(1.35*var(--u)) var(--sans);color:#9A6B00;margin-bottom:calc(.3*var(--u))}
.sub .en{display:block;font-weight:600;font-size:calc(2.05*var(--u));line-height:1.4;text-wrap:balance}
.sub .en b{font-weight:800;color:#1F3E8F}
.sub .ko{display:block;margin-top:calc(.25*var(--u));color:#60656d;font-size:calc(1.5*var(--u))}
.sub.noko .ko{display:none}
.mebar{display:block;height:calc(.35*var(--u));background:#00000014;border-radius:calc(1*var(--u));margin-top:calc(.6*var(--u));overflow:hidden}
.mebar i{display:block;height:100%;width:0;background:#F2C14E}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F2F4F1;opacity:0;transition:opacity .5s}
.card.on{opacity:1}
.card .ep{font-family:var(--mono);color:#2e5bd8;font-size:calc(1.7*var(--u));letter-spacing:.2em}
.card .t{color:#1F3E8F;font-size:calc(3.4*var(--u));line-height:1.25;font-weight:700;margin-top:calc(.6*var(--u));letter-spacing:-.02em;text-align:center;padding:0 calc(4*var(--u));text-wrap:balance}
.card .s{font-size:calc(2*var(--u));color:#60656d;margin-top:calc(.8*var(--u))}
.stage.tall{--u:2.4cqw}
.mbar{display:none;position:absolute;left:0;right:0;top:0;z-index:1;background:#ffffffeb;border-bottom:1px solid #dfe5ee;padding:calc(.8*var(--u)) calc(2*var(--u));text-align:center}
.mbar .lab{display:block;font-family:var(--mono);font-size:calc(1.1*var(--u));letter-spacing:.14em;color:#2e5bd8}
.mbar .en{display:block;color:#1F3E8F;font-weight:700;font-size:calc(1.75*var(--u));line-height:1.3;text-wrap:balance}
.mbar .ko{display:block;font-size:calc(1.35*var(--u));color:#60656d}
.stage.tall .mbar{display:block}
.stage.tall .screen{visibility:hidden}
.stage.tall .lower{top:calc(var(--mtop,0px) + 1.6*var(--u));left:calc(1.6*var(--u))}
.stage.tall .clock{top:calc(var(--mtop,0px) + 1.6*var(--u));right:calc(1.6*var(--u))}

.stage.tall .card .t{font-size:calc(2.5*var(--u))}
.stage.tall .card .s{font-size:calc(1.5*var(--u))}
/* 토론 중: 무대가 화면 높이를 가득 채움 */
.wrap.live{height:100vh;height:100dvh;padding:0;gap:6px}
.wrap.live .stage{aspect-ratio:auto;flex:1;min-height:0;border-radius:0;border-left:0;border-right:0}
.wrap.live .controls{padding:0 4px 6px}
.wrap:not(.live) :is(.stage,.bar,.controls){display:none}
body.embedded .wrap.live .lower{display:none}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}

.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--blue)}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font:600 12px var(--sans);border-radius:6px;padding:3px 9px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:26px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;min-width:72px}
@media (prefers-color-scheme:dark){.btn.primary{color:#0E1420}}
.btn[aria-pressed="true"]{border-color:var(--ink);color:var(--surface);background:var(--ink)}
.btn[hidden]{display:none}
.status{font-size:12px;color:var(--muted);margin-left:auto}
</style>
</head>
<body>
<script>if(window.parent!==window)document.body.classList.add("embedded")</script>
<div class="wrap" id="wrap">
  <section class="setup" id="setup">
    <div class="opt"><span class="lab">형식</span><div class="seg">
      <button class="pick" data-fmt="oneone">1:1 디베이트</button>
      <button class="pick" data-fmt="team">팀 디베이트 3:3</button></div></div>
    <div class="opt"><span class="lab">주제</span><select id="topic" aria-label="주제"></select></div>
    <div class="opt"><span class="lab">보기</span><div class="seg">
      <button class="pick" data-mode="watch">관전하기</button>
      <button class="pick" data-mode="seat">참가하기</button></div></div>
    <div class="opt top"><span class="lab">캐릭터</span><div class="castrow" id="castrow"></div></div>
    <div class="editor" id="editor" hidden>
      <div class="ed-head"><b id="edTitle"></b><button class="x" id="edClose" aria-label="닫기">✕</button></div>
      <label class="ed-row">이름<input type="text" id="edName" maxlength="12" autocomplete="off"><button class="pick" id="edReset" type="button">기본값</button></label>
      <label class="ed-row">발음<select id="edAcc"></select><button class="pick" id="edHear" type="button">▶ 듣기</button></label>
      <button class="pick" id="edMe" type="button">이 캐릭터로 참가하기</button>
    </div>
    <div class="foot">
      <label class="keep"><input type="checkbox" id="keep"> 이 설정 계속 쓰기</label>
      <button class="go" id="start" aria-label="디베이트 시작하기">Go!</button>
    </div>
    <p class="note" id="note"></p>
  </section>

  <div class="stage" id="stage" aria-label="디베이트 무대">
    <div class="world" id="bgw"></div>
    <canvas id="gl"></canvas>
    <div class="world" id="fgw"></div>
    <div class="hud">
      <div class="mbar" id="mbar"><span class="lab"></span><span class="en"></span><span class="ko"></span></div>
      <div class="lower" id="lower"><div class="a"></div><div class="b"></div></div>
      <div class="clock" id="clock" hidden>0:00</div>
      <div class="sub" id="sub"><span class="badge" hidden>🎤 내 차례! 소리 내어 말해 보세요</span><span class="en"></span><span class="ko"></span><span class="mebar" hidden><i></i></span></div>
      <div class="card" id="card"><div class="ep"></div><div class="t"></div><div class="s"></div></div>
    </div>
  </div>
  <div class="bar"><div id="bar"></div></div>
  <div class="controls">
    <button class="btn primary" id="play">일시정지</button>
    <button class="btn" id="skip" hidden>다음 줄 ▶</button>
    <button class="btn" id="hear" hidden>예시 듣기</button>
    <button class="btn" id="koBtn" aria-pressed="true">한글 자막</button>
    <button class="btn" id="subBtn" title="누를 때마다 자막 색이 바뀌어요 (자막 띠를 눌러도 돼요)">자막 색: 흰색</button>
    <button class="btn" id="reset">처음으로</button>
    <span class="status" id="status"></span>
  </div>
</div>

<script src="stage/rig.js"></script>
<script>
const STAGE_TOPICS = [["t01","AI를 학생회 임원으로","AI on the Student Council","This house would make AI a member of the school student council.","AI를 학교 학생회 임원으로 두어야 한다."],["t07","교실 스마트폰 금지","Ban Smartphones in Class","This house would ban smartphones in classrooms.","교실에서 스마트폰 사용을 금지해야 한다."]];
const W=1600,H=900,K=.6,GX=44,GY=60;
const $=s=>document.getElementById(s);
const stage=$('stage'),bgw=$('bgw'),fgw=$('fgw'),glc=$('gl');
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let simT=0, playing=true;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= characters (rig engine from Debate Stars) ================= */
const chars={};
function makeChar(id){
  const r=RIG[id], c={id,r,x:-500,floor:850,visible:false,z:0,jumpY:0,flip:1,seed:Math.random()*10,
    walkTo:null,speed:280,phase:0,walkAmp:0,talkUntil:-1,mouth:-1,mouthNext:0,blinkAt:1+Math.random()*3,blinkUntil:-1,
    look:0,lookT:0,react:[],faceKey:'',ready:false};
  c.img=new Image(); c.img.onload=()=>{c.ready=true;c.faceKey='';}; c.img.src=r.src;
  c.cv=document.createElement('canvas');c.cv.width=r.w;c.cv.height=r.h;c.ctx=c.cv.getContext('2d');
  c.shadow=document.createElement('div');c.shadow.className='shadow';
  chars[id]=c;return c;
}
Object.keys(RIG).forEach(makeChar);

function patch(ctx,x,y,rx,ry,col){
  ctx.save();ctx.translate(x,y);ctx.scale(rx,ry);
  const g=ctx.createRadialGradient(0,0,0,0,0,1);const s=`rgb(${col})`;
  g.addColorStop(0,s);g.addColorStop(.78,s);g.addColorStop(1,`rgba(${col},0)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,1,0,7);ctx.fill();ctx.restore();
}
const GLASSES={oliver:true};
function drawGlasses(ctx,r){
  const [[x1,y1,rx,ry],[x2,y2]]=r.eyes, w=rx*2.7, h=ry*2.05, y=(y1+y2)/2+2;
  ctx.save(); ctx.lineWidth=4.5; ctx.strokeStyle="#1d2a44"; ctx.fillStyle="rgba(255,255,255,.12)"; ctx.lineJoin="round"; ctx.lineCap="round";
  [x1,x2].forEach(x=>{ ctx.beginPath(); ctx.roundRect(x-w/2,y-h/2,w,h,12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-w/2+7,y-h/2+9); ctx.lineTo(x-w/2+14,y-h/2+6); ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=2.5; ctx.stroke(); ctx.strokeStyle="#1d2a44"; ctx.lineWidth=4.5; });
  ctx.beginPath(); ctx.moveTo(x1+w/2,y-3); ctx.quadraticCurveTo((x1+x2)/2,y-10,x2-w/2,y-3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1-w/2,y-4); ctx.lineTo(x1-w/2-12,y-8); ctx.moveTo(x2+w/2,y-4); ctx.lineTo(x2+w/2+12,y-8); ctx.stroke();
  ctx.restore();
}
/* 카드·배경용 이미지에도 안경을 그려 넣음 */
Object.keys(GLASSES).forEach(id=>{ const im=new Image(); im.onload=()=>{ const r=RIG[id], cv=document.createElement('canvas'); cv.width=r.w; cv.height=r.h;
  const x=cv.getContext('2d'); x.drawImage(im,0,0); drawGlasses(x,r); RIG[id].src=cv.toDataURL('image/png');
  document.querySelectorAll('img[data-who="'+id+'"]').forEach(e=>e.src=RIG[id].src); if(typeof renderCast==="function") renderCast(); }; im.src=RIG[id].src; });
function drawFace(c){

function showLine(l,mine){sub.querySelector('.en').innerHTML=bold(l[0]);sub.querySelector('.ko').textContent=l[1];sub.classList.add('on');sub.classList.toggle('me',!!mine);
  sub.querySelector('.badge').hidden=!mine;sub.querySelector('.mebar').hidden=!mine}
const embedded=window.parent!==window;
function lower(name,label,team){const l=$('lower');l.querySelector('.a').textContent=name;l.querySelector('.b').textContent=label;l.style.setProperty('--team',team);l.classList.add('on');
  if(embedded) parent.postMessage({speaker:{name,label,color:team}},"*");}
function lowerOff(){$('lower').classList.remove('on'); if(embedded) parent.postMessage({speaker:null},"*");}
function card(ep,t,s,on){const c=$('card');c.querySelector('.ep').textContent=ep;c.querySelector('.t').textContent=t;c.querySelector('.s').textContent=s;c.classList.toggle('on',on)}
let clockT=0, clockOn=false;
function setStatus(t){$('status').textContent=t}

/* 녹음된 대사 재생(캐릭터가 고른 발음 파일에서 그 구간만): 단어를 발음하는 동안만 입이 열림 */
function speak(si,s,id){
  return new Promise(async res=>{
    const c=chars[s.who], a=playerFor(s.who,data.id,data.fmt), [s0,dur,lt]=segTime(data,si,s.who);
    c.speaking=true; cur=a; curOn=true; let li=-1, done=false;
    const fin=()=>{ if(done) return; done=true; curOn=false; c.speaking=false; c.talkUntil=-1; a.pause(); res(); };
    await seekPlay(a,s0);
    const tick=()=>{
      if(done) return; if(id!==run){ fin(); return; }
      const t=a.currentTime-s0;
      if(t>=dur-.03 || a.ended){ fin(); return; }
      let n=0; while(n<lt.length-1 && t>=lt[n+1][0]) n++;
      if(n!==li){ li=n; showLine(s.lines[n],false); }
      const rel=t-lt[n][0]; const inWord=lt[n][2].some(([o,d])=>rel>=o-.02 && rel<=o+d);
      c.talkUntil = playing && inWord ? simT+.06 : -1;
      requestAnimationFrame(tick);
    };
    tick();
  });
}
/* 내가 맡은 자리: 자막을 한 줄씩 보여 주고, 예시 길이만큼 시간을 줌 */
function myTurn(si,s,id){
  return new Promise(async res=>{
    const c=chars[s.who], lt=segTime(data,si,s.who)[2]; c.speaking=true; $('skip').hidden=false; $('hear').hidden=false;
    for(let n=0;n<s.lines.length;n++){
      if(id!==run) break;
      showLine(s.lines[n],true); seg={si,s,n};
      const dur=Math.max(2.2,lt[n][1]*1.35+.8), start=simT; let skipped=false;
      skipLine=()=>{ skipped=true; };
      while(id===run && !skipped && simT-start<dur){
        sub.querySelector('.mebar i').style.width=Math.min(100,(simT-start)/dur*100)+"%";
        c.talkUntil = playing && Math.sin((simT-start)*5)>-.6 ? simT+.06 : -1;
        await new Promise(r=>requestAnimationFrame(r));
      }
    }
    c.speaking=false; c.talkUntil=-1; skipLine=null; seg=null; $('skip').hidden=true; $('hear').hidden=true; res();
  });
}
function playClip(id,d,si,n){
  const a=playerFor(id,d.id,d.fmt), [s0,,lt]=segTime(d,si,id), st=s0+lt[n][0], du=lt[n][1];
  seekPlay(a,st); const stopAt=()=>{ if(a.currentTime>=st+du-.02||a.paused) a.pause(); else requestAnimationFrame(stopAt); }; requestAnimationFrame(stopAt);
}
function hearExample(){ if(seg) playClip(seg.s.who,data,seg.si,seg.n); }

/* ================= 효과음 ================= */
let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(actx.state==="suspended") actx.resume(); return actx; }
function chime(){ /* 시작 팡파르: 밝은 4음 + 반짝임 */
  const a=ac(); if(!a) return; const t0=a.currentTime+.05, out=a.createGain(); out.gain.value=.22; out.connect(a.destination);
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(), t=t0+i*.12;
    o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+(i===3?1.3:.5));
    o.connect(g).connect(out); o.start(t); o.stop(t+1.4); });
  const o=a.createOscillator(), g=a.createGain(), t=t0+.36; o.type="sine"; o.frequency.value=2093;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+1.1); o.connect(g).connect(out); o.start(t); o.stop(t+1.2);
}
/* 박수: 사람 25명이 각자 박자(초당 3.5~5.5번)로 치는 손뼉을 공간 울림과 함께 미리 합성해 둠 */
const clapCache={};
function renderApplause(dur){
  if(clapCache[dur]) return clapCache[dur];
  const sr=44100, tail=1.4, OC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OC) return Promise.resolve(null);
  const oc=new OC(2,Math.ceil(sr*(dur+tail)),sr);
  // 손뼉 한 번: 아주 짧은 잡음 터짐 (몇 가지 모양을 만들어 돌려 씀)
  const shots=[0,1,2,3].map(()=>{ const n=Math.floor(sr*.06), b=oc.createBuffer(1,n,sr), d=b.getChannelData(0), k=.0025+Math.random()*.003;
    for(let x=0;x<n;x++){ const t=x/sr; d[x]=(Math.random()*2-1)*Math.exp(-t/k)*(t<.0008?t/.0008:1) + (Math.random()*2-1)*.18*Math.exp(-t/.02); } return b; });
  // 방 울림
  const ir=oc.createBuffer(2,Math.floor(sr*tail),sr);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let x=0;x<d.length;x++) d[x]=(Math.random()*2-1)*Math.pow(1-x/d.length,3)*.5; }
  const verb=oc.createConvolver(); verb.buffer=ir; const wet=oc.createGain(); wet.gain.value=.28; verb.connect(wet).connect(oc.destination);
  const dry=oc.createGain(); dry.gain.value=.55; dry.connect(oc.destination); dry.connect(verb);
  for(let p=0;p<25;p++){
    const bp=oc.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=900+Math.random()*1800; bp.Q.value=.8+Math.random()*1.2;
    const pan=oc.createStereoPanner?oc.createStereoPanner():null, g=oc.createGain(); g.gain.value=.35+Math.random()*.5;
    bp.connect(g); if(pan){ pan.pan.value=Math.random()*1.6-.8; g.connect(pan).connect(dry); } else g.connect(dry);
    const rate=3.5+Math.random()*2, start=Math.random()*.45, end=dur-Math.random()*.6, shot=shots[p%4];
    for(let t=start;t<end;t+=(1/rate)*(.85+Math.random()*.3)){
      const src=oc.createBufferSource(), cg=oc.createGain(); src.buffer=shot; src.playbackRate.value=.85+Math.random()*.35;
      const env=Math.min(1,t/.35)*Math.min(1,(dur-t)/.7); cg.gain.value=env*(.6+Math.random()*.4);
      src.connect(cg).connect(bp); src.start(t);
    }
  }
  return clapCache[dur]=oc.startRendering();
}
const clapBufs={};
function loadClaps(){ const a=ac(); if(!a) return; ["applause-short","applause-end"].forEach(n=>{ if(clapBufs[n]) return; clapBufs[n]="loading";
  fetch("sfx/"+n+".mp3").then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>a.decodeAudioData(b,ok,no))).then(buf=>clapBufs[n]=buf).catch(()=>{ delete clapBufs[n]; }); }); }
function applause(dur){
  const a=ac(); if(!a) return; const rec=clapBufs[dur<3?"applause-short":"applause-end"];
  if(rec && rec!=="loading"){ const src=a.createBufferSource(), g=a.createGain(); src.buffer=rec; g.gain.value=.8; src.connect(g).connect(a.destination); src.start(); return; }
  const p=renderApplause(dur); if(!p) return; /* 녹음을 못 불러왔을 때만 합성 박수 */
  p.then(buf=>{ if(!buf) return; const src=a.createBufferSource(), g=a.createGain(), comp=a.createDynamicsCompressor(); src.buffer=buf; g.gain.value=.9; comp.threshold.value=-10; comp.ratio.value=4; src.connect(g).connect(comp).connect(a.destination); src.start(); /* 소리가 찢어지지 않게 */ }).catch(()=>{});
}
function gavel(){ /* 사회자 의사봉 두 번 */
  const a=ac(); if(!a) return; [0,.28].forEach(dt=>{ const t=a.currentTime+.05+dt, o=a.createOscillator(), g=a.createGain();
    o.type="sine"; o.frequency.setValueAtTime(240,t); o.frequency.exponentialRampToValueAtTime(110,t+.12);
    g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g).connect(a.destination); o.start(t); o.stop(t+.2);
    const nb=a.createBuffer(1,Math.floor(a.sampleRate*.03),a.sampleRate), nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.exp(-i/(nd.length*.15));
    const ns=a.createBufferSource(), ng=a.createGain(); ns.buffer=nb; ng.gain.value=.35; ns.connect(ng).connect(a.destination); ns.start(t); });
}

async function startDebate(){
  const id=++run, tid=cfg.topic, fmt=cfg.fmt;
  ac(); // 효과음 잠금 풀기 (버튼을 누른 순간에)
  loadClaps();
  castIds().forEach(k=>{const a=playerFor(k,tid,fmt);a.muted=true;const p=a.play();if(p)p.then(()=>{a.pause();a.muted=false}).catch(()=>{a.muted=false})}); // 휴대폰 소리 잠금 풀기
  setStatus("불러오는 중…");
  try{ data=await getData(tid,fmt); }catch(e){ setStatus("무대 대본을 불러오지 못했어요"); return; }
  if(id!==run) return;
  me = cfg.mode==="seat" ? cfg.me : null;
  openEditor(null);
  $('setup').hidden=true; setLive(true); setPlay(true); lowerOff(); sub.classList.remove('on');
  const {prop,opp}=buildSet(data);
  [...prop,...opp,CHAIR].forEach(k=>{const c=chars[k];c.x=c.home<800?-200:1800;});
  shot.wide(0);
  card(fmt==="team"?"TEAM DEBATE · 3 vs 3":"ONE-ON-ONE DEBATE", data.motion, data.ko, true); chime();
  await wait(2.6,id); card("","","",false);
  [...prop,...opp,CHAIR].forEach((k,i)=>setTimeout(()=>{const c=chars[k];c.walkTo=c.home;c.speed=420;},i*160));
  await wait(3.2,id);
  [...prop,...opp].forEach(k=>chars[k].react.push({k:'wave',s:simT,d:1.4})); applause(2.6);
  const total=data.segs.length;
  for(segIdx=0;segIdx<total;segIdx++){
    if(id!==run) return;
    const s=data.segs[segIdx]; $('bar').style.width=(segIdx/total*100)+"%";
    const c=chars[s.who], accL=ACC[accOf(s.who)][0];
    if(s.key==="chair"){
      setStatus("사회자 진행");
      shot.on(CHAIR,1,2.1); Object.values(chars).forEach(x=>x.look= x.id===CHAIR?0:(x.x<CHAIRX?.6:0));
      lower(fullName(CHAIR),`사회자 · ${accL}`,"#6B7280");
      if(segIdx===0) gavel();
      await wait(.9,id); await speak(segIdx,s,id); lowerOff(); await wait(.5,id);
    }else{
      const team=s.key[0]==="P"?"#D94F8C":"#2F6FD0", mine=me===s.who;
      setStatus(mine?"내 차례예요!":`${shortName(s.who)} 연설 중`);
      shot.wide(1); c.z=5; c.walkTo=800; c.speed=330; sub.classList.remove('on');
      Object.values(chars).forEach(x=>x.look= x.id===s.who?0:(x.x<800?.5:-.5));
      await wait(1.9,id); shot.lect(1.4);
      lower(fullName(s.who)+(mine?" (나)":""),`${ROLES[cfg.fmt][s.who]} · ${accL}`,team);
      clockT=0; clockOn=true; $('clock').hidden=false;
      const nodder=setInterval(()=>{ if(!playing) return; const mates=Object.values(chars).filter(x=>x.visible&&x.id!==s.who&&x.id!==CHAIR);
        const m=mates[Math.random()*mates.length|0]; if(m) m.react.push({k:(m.x<800)===(s.key[0]==="P")?'nod':(Math.random()<.5?'shake':'nod'),s:simT,d:1}); },3800);
      await wait(.6,id);
      if(mine) await myTurn(segIdx,s,id); else await speak(segIdx,s,id);
      clearInterval(nodder); clockOn=false; $('clock').hidden=true; lowerOff(); sub.classList.remove('on');
      if(id!==run) return;
      shot.wide(1.2); c.walkTo=c.home; await wait(1.8,id); c.z=0;
    }
  }
  if(id!==run) return;
  $('bar').style.width="100%"; setStatus("토론 끝!");
  Object.values(chars).filter(c=>c.visible).forEach((c,i)=>setTimeout(()=>c.react.push({k:'cheer',s:simT,d:2.6}),i*90)); applause(3.4);
  await wait(3,id); card("THE END","수고했어요!","다른 형식이나 자리로 다시 해 보세요",true);
  await wait(2.5,id); if(id===run){ card("","","",false); $('setup').hidden=false; setLive(false); preview(); }
}

/* ================= loop & controls ================= */
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now; if(!playing)dt=0; simT+=dt;
  if(clockOn){clockT+=dt;const s=Math.floor(clockT);$('clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
  render(dt); requestAnimationFrame(frame);
}
function setPlay(p){playing=p;$('play').textContent=p?'일시정지':'재생';stage.classList.toggle('paused',!p);
  if(cur){ if(!p) cur.pause(); else if(curOn) cur.play().catch(()=>{}); }}
$('play').onclick=()=>setPlay(!playing);
$('skip').onclick=()=>skipLine&&skipLine();
$('hear').onclick=hearExample;
function setSubDark(on){ sub.classList.toggle('dark',on); $('subBtn').textContent=on?'자막 색: 검정':'자막 색: 흰색'; try{localStorage.setItem('dstage_subdark',on?'1':'0')}catch(e){} }
$('subBtn').onclick=()=>setSubDark(!sub.classList.contains('dark'));
sub.addEventListener('click',()=>setSubDark(!sub.classList.contains('dark')));
/* 자막 색 기본값은 검정 (흰색을 골라 둔 경우만 흰색) */
let subPref=null; try{ subPref=localStorage.getItem('dstage_subdark'); }catch(e){}
setSubDark(subPref!=='0');
$('koBtn').onclick=()=>{const on=sub.classList.toggle('noko');$('koBtn').setAttribute('aria-pressed',!on)};
$('reset').onclick=()=>{run++;if(cur)cur.pause();curOn=false;setPlay(true);lowerOff();sub.classList.remove('on');card("","","",false);$('clock').hidden=true;$('setup').hidden=false;setLive(false);preview();setStatus("")};

/* ================= setup UI ================= */
let editing=null;
function faceImg(id,bw,bh){ /* 캐릭터 이미지에서 머리 전체가 칸에 들어오게 */
  const r=RIG[id], h=r.h*bh/(r.chin+40), sc=h/r.h, im=new Image();
  im.src=r.src; im.alt=""; im.style.height=h+"px"; im.style.left=(bw/2-r.mouth[0]*sc)+"px"; im.style.top=(bh-(r.chin+40)*sc+4)+"px"; return im;
}
const NICK={liam:"Calm Opener",chloe:"Evidence Queen",noah:"Rebuttal Ace",olivia:"Golden Voice",leo:"Cool Logician",ruby:"POI Sniper",oliver:"Team Captain"};
function renderCast(){
  const row=$('castrow'); row.innerHTML="";
  castIds().forEach(id=>{
    const mine=cfg.mode==="seat"&&cfg.me===id, b=document.createElement('button'); b.type="button"; b.className="cc"+(mine?" me":"");
    b.setAttribute('aria-expanded',editing===id); b.setAttribute('aria-label',`${shortName(id)} 설정`);
    const f=document.createElement('span'); f.className="face"; b.appendChild(f);
    b.insertAdjacentHTML('beforeend','<span class="en"></span><span class="ko"></span><span class="nick"></span><span class="rl"></span>');
    b.querySelector('.en').textContent=cfg.names[id]||CAST[id].name; b.querySelector('.ko').textContent=cfg.names[id]?CAST[id].ko:CAST[id].ko;
    b.querySelector('.nick').textContent=NICK[id];
    b.querySelector('.rl').textContent=`${ROLES[cfg.fmt][id]} · ${ACC[accOf(id)][1]} ${ACC[accOf(id)][0]}`;
    if(mine) b.insertAdjacentHTML('beforeend','<span class="badge">나</span>');
    b.onclick=()=>{ if(cfg.mode==="seat" && id!==CHAIR && cfg.me!==id){ cfg.me=id; save(); renderCast(); openEditor(id); return; } openEditor(editing===id?null:id); };
    row.appendChild(b);
    const fw=f.clientWidth||76, fh=f.clientHeight||61; f.appendChild(faceImg(id,fw,fh));
  });
}
function openEditor(id){
  editing=id; $('editor').hidden=!id; renderCast(); if(!id){ resize(); return; }
  $('edTitle').textContent=`${shortName(id)} · ${ROLES[cfg.fmt][id]}`;
  $('edName').value=cfg.names[id]||""; $('edName').placeholder=CAST[id].ko;
  $('edAcc').value=accOf(id);
  const mine=cfg.mode==="seat"&&cfg.me===id;
  $('edMe').hidden=id===CHAIR; $('edMe').setAttribute('aria-pressed',mine);
  $('edMe').textContent=mine?"✓ 내 캐릭터":"이 캐릭터로 참가하기";
  resize();
}
Object.entries(ACC).forEach(([k,[ko,fl]])=>{const o=document.createElement('option');o.value=k;o.textContent=`${fl} ${ko}`;$('edAcc').appendChild(o)});
$('edClose').onclick=()=>openEditor(null);
$('edName').oninput=()=>{const v=$('edName').value.trim(); if(v) cfg.names[editing]=v; else delete cfg.names[editing]; save(); syncPicks(); $('edTitle').textContent=`${shortName(editing)} · ${ROLES[cfg.fmt][editing]}`;};
$('edReset').onclick=()=>{delete cfg.names[editing]; delete cfg.acc[editing]; save(); openEditor(editing);};
$('edAcc').onchange=()=>{const v=$('edAcc').value; if(v===CAST[editing].acc) delete cfg.acc[editing]; else cfg.acc[editing]=v; save(); renderCast();};
$('edHear').onclick=async()=>{ /* 고른 발음으로 이 캐릭터의 첫 대사 한 줄 */
  const id=editing; try{const d=await getData(cfg.topic,cfg.fmt); const si=d.segs.findIndex(s=>s.who===id); if(si>=0) playClip(id,d,si,0);}catch(e){}
};
$('edMe').onclick=()=>{cfg.me=editing; cfg.mode="seat"; save(); syncPicks(); openEditor(editing);};
$('keep').onchange=()=>{keep=$('keep').checked; save();};
function syncPicks(){
  document.querySelectorAll('.pick[data-fmt]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.fmt===cfg.fmt));
  document.querySelectorAll('.pick[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===cfg.mode));
  if(cfg.me && !debaters().includes(cfg.me)) cfg.me=null;
  if(cfg.mode==="seat" && !cfg.me) cfg.me=debaters()[0];

  $('note').textContent = cfg.mode==="seat"
    ? "내가 맡을 캐릭터 카드를 눌러요 (노란 '나' 표시). 내 차례엔 자막이 노랗게 바뀌니 소리 내어 말해 보세요."
    : "캐릭터를 누르면 이름과 발음을 바꿀 수 있어요. 기본은 캐릭터마다 다른 나라 발음이에요.";
  renderCast();
}
document.querySelectorAll('.pick[data-fmt],.pick[data-mode]').forEach(b=>b.onclick=()=>{
  if(b.dataset.fmt){ cfg.fmt=b.dataset.fmt; if(editing && !castIds().includes(editing)) editing=null; preview(); }
  else cfg.mode=b.dataset.mode;
  save(); syncPicks(); openEditor(editing);
});
STAGE_TOPICS.forEach(([id,ko,en])=>{const o=document.createElement('option');o.value=id;o.textContent=`${ko} · ${en}`;$('topic').appendChild(o)});
$('topic').value=cfg.topic;
$('topic').onchange=()=>{cfg.topic=$('topic').value; save(); preview();};
$('keep').checked=keep;
$('start').onclick=startDebate;
/* 시작 전 미리보기: 고른 형식대로 캐릭터가 자리에 서 있음 */
function preview(){
  const t=STAGE_TOPICS.find(x=>x[0]===cfg.topic);
  buildSet({fmt:cfg.fmt,order:ORDERS[cfg.fmt],seats:SEATS[cfg.fmt],motion:t?t[3]:"",ko:t?t[4]:""}); shot.wide(0);
}
syncPicks(); preview();
requestAnimationFrame(t=>{last=t;frame(t)});
</script>
